version: 2

build:
  os: ubuntu-lts-latest
  apt_packages:
    - catch
    - g++
    - libdeflate-dev
    - libisal-dev
    - valgrind
  jobs:
    pre_build:
      - git submodule update --init --recursive
      - make -C src doc
  tools:
    python: latest

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
